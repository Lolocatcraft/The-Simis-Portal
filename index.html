<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Cole aqui suas credenciais do Firebase   
    const firebaseConfig = {
        apiKey: "AIzaSyAIvCwmmt1b5aiR-ICVLpri1tGNkHT9N2I",
        authDomain: "teste-6c903.firebaseapp.com",
        databaseURL: "https://teste-6c903-default-rtdb.firebaseio.com",
        projectId: "teste-6c903",
        storageBucket: "teste-6c903.firebasestorage.app",
        messagingSenderId: "533175479741",
        appId: "1:533175479741:web:8ab72892f6f5b0adbe76d4
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const raizRef = ref(db);
      
    async function listarNomesEStatus() {
  try {
    const snapshot = await get(raizRef);

    if (snapshot.exists()) {
      const dados = snapshot.val();

      let i = 1;
      for (const nome in dados) {
        const jogador = dados[nome];

        if (i <= 5) {
          localStorage.setItem("Skin" + i, jogador.Skin);
          localStorage.setItem("Name" + i, jogador.Apelido);
          i++;
        }
      }
    } else {
      console.log("Nenhum nó encontrado.");
    }
  } catch (error) {
    console.error(error);
  }
}

    
    document.addEventListener("DOMContentLoaded", function() {
            listarNomesEStatus();
            localStorage.setItem("UsuarioLocal", "");
    })
    
</script>
<body>

    <script>

       document.addEventListener("DOMContentLoaded", function() {

             // Verifica qual valor está salvo e troca o src

                img.setAttribute("src", "img/PodSims.PNG");

            const skins = {

                "MorajoCute": "img/Foto de Perfil do Morajo Cute.webp",
                "MorajoPadrão": "img/Foto de perfil do Morajo.jpg",

                "MorajoAnime": "img/Foto de Perfil Morajo Anime.jpg",
                "Y2Kbr": "img/Foto de perfil Brasil Y2k.png"
            };

            // Recupera os três valores do localStorage
            const skin1 = localStorage.getItem("Skin1");
