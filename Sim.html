<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/TheSimisLogo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>The Simis Portal</title>
</head>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAIvCwmmt1b5aiR-ICVLpri1tGNkHT9N2I",
        authDomain: "teste-6c903.firebaseapp.com",
        databaseURL: "https://teste-6c903-default-rtdb.firebaseio.com",
        projectId: "teste-6c903",
        storageBucket: "teste-6c903.firebasestorage.app",
        messagingSenderId: "533175479741",
        appId: "1:533175479741:web:8ab72892f6f5b0adbe76d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.enviarTexto = function() {
        const nome = document.getElementById("textoInput").value;
        localStorage.setItem("UsuarioLocal", nome)
        localStorage.setItem("UsuarioLocalPerm", nome)
        const usuarioRef = ref(db, nome);

        onValue(usuarioRef, (snapshot) => {
            const data = snapshot.val();
            set(usuarioRef, {
                Skin: "",
                Status: "Status: Online",
                Bibliografia: "",
                Apelido: nome,
                PapelDeParede: ""
            })
            window.location.href = "SimSkin.html"
        }, { onlyOnce: true }); // lê só uma vez
    }
</script>
<style>
    body {
        text-align: center;
    }
</style>
<body>
    <div class="Cabesalho">
        <div class="LadoALado1">
            <img onclick="window.location.href='index.html'" class="imglogo" src="img/TheSimisLogo.jpg">
            <img onclick="window.location.href='Sim.html'" class="imglogo" src="img/Conta.png">
        </div>
    </div>
    <h1>Menu Criar um sim</h1>
    <p class="CursiveP">Olá, coloque o nome do seu sim<br>Primeiro Vc ira colocar o nome pro seu sim</p>
    <input class="CursiveP" type="text" id="textoInput" placeholder="Nome so seu sim">
    <button class="CursiveP" onclick="enviarTexto()">Confirmar Nome</button>
    <div>
        <a class="CursiveP" href="SimLogin.html">Já tenho um sim</a>
    </div>
</body>
</html>
