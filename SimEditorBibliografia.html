<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/TheSimisLogo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>The Simis Portal | Editor</title>
</head>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Cole aqui suas credenciais do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAIvCwmmt1b5aiR-ICVLpri1tGNkHT9N2I",
        authDomain: "teste-6c903.firebaseapp.com",
        databaseURL: "https://teste-6c903-default-rtdb.firebaseio.com",
        projectId: "teste-6c903",
        storageBucket: "teste-6c903.firebasestorage.app",
        messagingSenderId: "533175479741",
        appId: "1:533175479741:web:8ab72892f6f5b0adbe76d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const usuarioAtual = localStorage.getItem("UsuarioLocal");
    const usuarioRef = ref(db, usuarioAtual);

    // Função para enviar texto
    window.enviarTexto = function() {
        const valor = document.getElementById("textoInput").value;
        update(usuarioRef, {
            Bibliografia: valor
        });
        window.location.href = "SimPortal.html";
    }
</script>
<style>
    body {
        text-align: center;
    }
</style>
<body>
    <div class="Cabesalho">
        <div class="LadoALado1">
            <img onclick="window.location.href='index.html'" class="imglogo" src="img/TheSimisLogo.jpg">
            <img onclick="window.location.href='Sim.html'" class="imglogo" src="img/Conta.png">
        </div>
    </div>
    <h1>Menu Editor</h1>
    <p class="CursiveP">Coloque a sua bibliografia aqui</p>
    <input class="CursiveP" type="text" id="textoInput" placeholder="Hmm.... Quem eu sou...">
    <button class="CursiveP" onclick="enviarTexto()">enviar</button>
</body>
</html>
